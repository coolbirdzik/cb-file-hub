name: cb_file_manager
description: A new Flutter application.
publish_to: none

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.1.4+2

environment:
  # Floor set by the resolved dependency graph: sqflite_common, synchronized and
  # sqflite_android need Dart >=3.12, which pairs with Flutter >=3.44. This is
  # also the package's language version, so the code is analysed and formatted
  # as Dart 3.12 rather than the 2.15 the old floor implied.
  sdk: ">=3.12.0 <4.0.0"

# package:sqlite3 (via sqflite_common_ffi): use OS SQLite on Windows so integration_test
# does not rely on bundled sqlite3.dll next to the exe (avoids load error 126 on Debug runs).
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^9.1.0
  provider: ^6.1.2
  path_provider: ^2.1.1
  package_info_plus: ^10.2.1
  equatable: ^2.0.7
  permission_handler: ^13.0.2
  # video_thumbnail: ^0.5.3  # Commented out the pub.dev version
  # Sử dụng video_thumbnail trực tiếp từ GitHub repository
  video_thumbnail:
    git:
      url: https://github.com/EduardoM-GO/video_thumbnail
      # Pinned to a commit rather than `master`: this is a third-party fork, and
      # tracking its branch would let `pub upgrade` pull unreviewed changes.
      ref: ff055bc28bd0394d1d03c14ca2cd41d88bae79dd
  path: ^1.8.3
  shared_preferences: ^2.2.2
  window_manager: ^0.5.2 # Added for desktop window management
  phosphor_flutter: ^2.1.0 # Phosphor Icons - soft, minimal line icons
  visibility_detector: ^0.4.0+2 # Added for detecting visible thumbnails
  diacritic: ^0.1.6 # Vietnamese text normalization
  # FTP connection - using custom implementation

  sqflite: ^2.4.2
  sqflite_common: ^2.5.5
  sqflite_common_ffi: ^2.3.6

  # VLC 2.1.2 plugin with the Windows runtime pinned to VLC 3.0.23.
  vlc_player:
    path: third_party/vlc_player

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  file_picker: ^12.2.0
  win32: ^6.4.0
  crypto: ^3.0.6
  # Dependency injection
  get_it: ^9.2.1
  # Functional programming (Either type)
  dartz: ^0.10.1
  share_plus: ^13.3.0
  flutter_colorpicker: ^1.1.0
  # File caching
  flutter_cache_manager: ^3.3.1
  uuid: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  logger: ^2.0.0
  fluent_ui: ^4.13.0

  ffi: ^2.1.0
  url_launcher: ^6.3.1
  open_filex: ^4.3.4
  gal: ^2.3.0
  # Removed smb_connect - using mobile_smb_native instead
  mobile_smb_native:
    path: ../mobile_smb_native # Local path to mobile SMB plugin
  image: ^4.5.4
  crop_your_image: ^2.0.0
  vector_math: ^2.1.4
  pdfx: ^2.0.0
  # HTTP server for streaming files from SMB
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5
  http: ^1.4.0
  mime: ^2.0.0
  desktop_drop: ^0.8.4 # OS-level file drag-and-drop support
  flutter_markdown_plus: ^1.0.12 # Continues the discontinued flutter_markdown
  flutter_secure_storage: ^11.0.0 # Secure token storage for local AI advisor
  flutter_gemma: ^1.7.0
  flutter_gemma_litertlm: ^1.6.1
  google_fonts: ^8.2.1
  highlight: ^0.7.0
  archive: ^4.0.9
  dartssh2: ^4.1.0
  xterm:
    path: third_party/xterm # Flutter view-aware text input; see PATCHES.md
  pinenacl: ^0.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  msix: ^3.16.9
  # Used by integration_test/e2e_sandbox_paths.dart to isolate app data
  # (DB/tags/prefs/cache) into a throwaway sandbox during E2E + screenshots.
  path_provider_platform_interface: ^2.0.1

# Ghi đè các phiên bản gói phụ thuộc để giải quyết xung đột
dependency_overrides:
  # Upstream 2.1.0 (the newest release, and still what `main` carries) declares
  # `class PhosphorIconData extends IconData`, which no longer compiles now that
  # Flutter marks IconData final. Trimmed local build patches that; see
  # third_party/phosphor_flutter/README.md
  phosphor_flutter:
    path: third_party/phosphor_flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/logo.png
    # Bundled so registerCbFontLicenses() can surface them in the app's
    # licence page — the OFL requires the licence to ship with the font.
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  # CoolBird design system typography. Both families are SIL Open Font
  # License 1.1 — free for commercial use, redistributable with the app —
  # and both cover the full Vietnamese range (including ₫ U+20AB).
  # Licences ship alongside the binaries in assets/fonts/.
  # Only the three weights the type scale actually uses are bundled; see
  # lib/design_system/tokens/cb_type_tokens.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
  #  - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

msix_config:
  display_name: CB FileHub
  publisher_display_name: CoolBirdZik
  identity_name: CoolBirdZik.CBFileHub
  publisher: CN=C193F601-16B4-4BC5-89D3-1AE882F628DE
  logo_path: assets/images/logo_circle.png
  trim_logo: false
  install_certificate: false
  architecture: x64
  capabilities: internetClient, privateNetworkClientServer
